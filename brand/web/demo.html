<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baron Builders</title>
<!-- 1) Add this as the FIRST script in <head>, synchronous (no async/defer). That's the whole install. -->
<script src="baron-loader.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#101114;background:#f7f6f4}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw;background:#101114;color:#fff}
header b{font:900 18px "Montserrat",Arial,sans-serif;letter-spacing:.04em}header b span{color:#ff4b57}
nav{display:flex;gap:24px;font-size:14px;color:#cfcdc8}
.hero{padding:12vh 6vw;max-width:980px}
.hero h1{font:900 clamp(36px,6vw,68px)/1.02 "Montserrat",Arial,sans-serif;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#c41e2a}
.hero p{margin:20px 0 28px;color:#615f5a;max-width:52ch}
.hero a{display:inline-block;background:#c41e2a;color:#fff;padding:13px 22px;border-radius:4px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header><b>BARON <span>BUILDERS</span></b><nav><span>Residential</span><span>Commercial</span><span>Projects</span><span>Contact</span></nav></header>
<section class="hero">
  <h1>We build what <em>stands</em>.</h1>
  <p>Residential and commercial construction, delivered on schedule. This is a demo page: the Baron Builders loader covered it until the page finished loading.</p>
  <a href="#">Start a project</a>
</section>
</body>
</html>
